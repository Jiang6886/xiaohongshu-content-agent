name: shiye-mcp
services:
  xiaohongshu-mcp:
    image: shiye/xiaohongshu-mcp:v2.5.5-search-fix1
    build:
      context: .
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:18060:18060"
    environment:
      COOKIES_PATH: /app/data/cookies.json
      XDG_CONFIG_HOME: /app/data/config
    volumes:
      - ../../data/mcp:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
